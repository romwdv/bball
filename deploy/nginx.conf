# Configuration Nginx pour Coolify

# Le build est 100 % statique (`output: 'export'`). Ces en-têtes sont la seule
# configuration serveur nécessaire, et ils sont **structurels** : sans eux, la PWA
# sert une ancienne version du service worker, et le coach saisit un match avec un
# pré-cache périmé.

server {
    listen 80;
    server_name stats.exemple.fr;
    root /var/www/stats-basket/out;
    index index.html;

    # ─── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # `application/json` absent, c'est le manifeste de pré-cache et les requêtes
    # vers Supabase qui ne transitent pas par Nginx — donc peu importe ici. En
    # revanche `application/wasm` et `font/woff2` le feraient.
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # ─── Cache HTTP ──────────────────────────────────────────────────────────
    #
    # Trois régimes, et un seul critère : *le contenu peut-il changer sans que
    # l'URL change ?*
    #
    #   non  → `immutable` pendant un an. Le nom du fichier contient le hash de
    #          son contenu ; si l'URL est identique, le fichier l'est aussi.
    #   oui  → `no-cache`. Le navigateur revalide à chaque visite.
    #
    # C'est le service worker qui rend la deuxième catégorie nécessaire, et il
    # s'agit d'un piège réel : `sw.js` en cache, c'est un worker qui met à jour en
    # arrière-plan mais ne s'exécute qu'au **prochain** chargement. Le coach
    # passerait le reste de la saison sur une version antérieure, avec un pré-cache
    # d'une autre version — donc des requêtes qui échouent, et des matchs qui ne se
    # synchronisent pas. Le symptôme (« ça marchait hier ») ne mène nulle part.

    # Assets hashés par Next : immuables par construction.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Le service worker lui-même : jamais en cache. C'est **le** fichier qui
    # doit pouvoir être remplacé.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # Le manifeste de pré-cache est régénéré à chaque build et ne contient aucun
    # secret : `no-cache` le garde frais sans jamais neutraliser le cache.
    location = /sw-precache-manifest.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Le manifeste PWA, pour la même raison : changer les icônes ou le nom sans
    # que l'invite d'installation se mette à jour laisserait une icône périmée sur
    # l'écran d'accueil.
    location ~* ^/(manifest\.json|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        types { } default_type "application/manifest+json";
        try_files $uri =404;
    }

    # Le HTML : toujours revalidé. Il référence les bundles par leur nom hashé ;
    # le laisser en cache servirait une page pointant vers un bundle supprimé.
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # La page hors-ligne doit répondre **même sans réseau** : c'est le seul but.
    location /~offline/ {
        add_header Cache-Control "no-cache" always;
        try_files /~offline/index.html =404;
    }

    # Les icônes changent quand le thème change. `no-cache` suffit : elles ne sont
    # téléchargées qu'à l'installation, et quatre fichiers de 3 ko.
    location /icons/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Défaut : assets, polices, icônes. Un an avec revalidation, compromis
    # acceptable pour tout ce qui n'est pas critique.
    location / {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # ─── Sécurité ────────────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # `connect-src` doit autoriser Supabase : c'est la seule origine tierce que
    # l'application contacte. Le service worker en a besoin aussi pour ses
    # propres requêtes.
    #
    # ⚠️ Adapter `https://*.supabase.co` à l'URL réelle du projet. La valeur
    # générique couvre un seul niveau de sous-domaine, ce qui suffit pour
    # `https://projet.supabase.co` mais pas pour `https://api.projet.supabase.co`.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; worker-src 'self'; base-uri 'self'" always;
}
